services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nevis
      POSTGRES_USER: nevis
      POSTGRES_PASSWORD: nevis
    ports:
      - "5432:5432"
    healthcheck:
      # Wait until Postgres genuinely accepts queries (avoids the first-boot false-ready).
      test: ["CMD-SHELL", "pg_isready -U nevis -d nevis"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  embedder:
    build:
      context: ./embedder
      args:
        # 0 by default (works out of the box). Set TRUST_LOCAL_CA=1 in your env only when
        # building behind a TLS-inspecting proxy (e.g. Zscaler); requires a *.crt in context.
        TRUST_LOCAL_CA: ${TRUST_LOCAL_CA:-0}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20          # model load on first start can take a little while
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "/bin/ollama serve"]

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "qwen2.5:1.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  api:
    build:
      context: .
      args:
        TRUST_LOCAL_CA: ${TRUST_LOCAL_CA:-0}
    depends_on:
      db:
        condition: service_healthy
      embedder:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/nevis
      DB_USER: nevis
      DB_PASSWORD: nevis
      EMBEDDER_URL: http://embedder:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8080:8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    platform: linux/amd64
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15        # 150s total — enough for Rosetta emulation cold start
      start_period: 60s  # don't count failures in the first 30s at all

#  kibana:
#      image: docker.elastic.co/kibana/kibana:8.14.0
#      ports:
#        - "5601:5601"
#      depends_on:
#        elasticsearch:
#          condition: service_healthy

volumes:
  pgdata:
  ollama_data:
  es_data:
